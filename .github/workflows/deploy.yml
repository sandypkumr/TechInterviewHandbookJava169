name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            scripts/package-lock.json
            docs/package-lock.json

      - name: Install pipeline dependencies
        run: npm install
        working-directory: scripts

      - name: Generate MDX content from Java sources
        run: node generate-content.mjs
        working-directory: scripts

      - name: Enrich MDX with complexity and pattern metadata
        run: node enrich-metadata.mjs --write
        working-directory: scripts

      - name: Validate generated content
        run: node validate-content.mjs
        working-directory: scripts

      - name: Install Astro dependencies
        run: npm ci
        working-directory: docs

      - name: Build Astro site
        run: npm run build
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
