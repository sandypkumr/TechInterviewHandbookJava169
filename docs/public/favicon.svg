<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Indigo rounded background -->
  <rect width="32" height="32" rx="7" fill="#4F46E5"/>
  <!-- Connector lines (behind nodes) -->
  <line x1="16" y1="12" x2="9.5"  y2="20.5" stroke="#818CF8" stroke-width="2"   stroke-linecap="round"/>
  <line x1="16" y1="12" x2="22.5" y2="20.5" stroke="#818CF8" stroke-width="2"   stroke-linecap="round"/>
  <line x1="9.5" y1="23.5" x2="5.5"  y2="28.5" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="9.5" y1="23.5" x2="13.5" y2="28.5" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Root node -->
  <circle cx="16"  cy="8.5"  r="3.5" fill="#FFFFFF"/>
  <!-- Level-2 nodes -->
  <circle cx="9.5"  cy="23.5" r="3"   fill="#C7D2FE"/>
  <circle cx="22.5" cy="23.5" r="3"   fill="#C7D2FE"/>
  <!-- Level-3 leaf nodes (left subtree only) -->
  <circle cx="5.5"  cy="29"   r="2"   fill="#818CF8"/>
  <circle cx="13.5" cy="29"   r="2"   fill="#818CF8"/>
</svg>
